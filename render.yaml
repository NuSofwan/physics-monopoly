services:
  - type: web
    name: physics-monopoly-server
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; the server reads process.env.PORT.
      # No database/OIDC on the free tier: this deploy runs the legacy
      # free-play game only (no classroom/teacher features). FREE_PLAY_MODE
      # is the explicit opt-in that productionConfig.ts requires so startup
      # does not fail closed on the missing DATABASE_URL/OIDC_* variables.
      - key: NODE_ENV
        value: production
      - key: FREE_PLAY_MODE
        value: "true"
      # Set in the Render dashboard (exact HTTPS origins, no trailing slash):
      #   ALLOWED_ORIGINS = REQUIRED: the Vercel origin(s), comma-separated, e.g. https://physics-monopoly.vercel.app
      #   APP_ORIGIN      = optional in free play: the Vercel front-end origin, e.g. https://physics-monopoly.vercel.app
      #   API_ORIGIN      = optional in free play: this Render service's own origin, e.g. https://physics-monopoly-server.onrender.com
      #                     (if set, it must appear in ALLOWED_ORIGINS exactly)
      - key: APP_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
