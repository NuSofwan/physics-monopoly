services:
  - type: web
    name: physics-monopoly-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; the server reads process.env.PORT.
      # Set ALLOWED_ORIGINS in the Render dashboard to your Vercel domain, e.g.
      # https://physics-monopoly.vercel.app (comma-separated for multiple).
      - key: ALLOWED_ORIGINS
        sync: false
